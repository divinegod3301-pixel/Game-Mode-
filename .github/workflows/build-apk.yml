name: Build TYRO KANJI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and extract project ZIP
        run: |
          echo "Searching for ZIP file..."

          ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Gradle project root
        run: |
          PROJECT_DIR=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found Gradle project: $PROJECT_DIR"

      - name: Show project structure
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

          echo "Settings file:"
          find "$PROJECT_DIR" -maxdepth 1 -type f -name "settings.gradle*" -print

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Find APK
        run: |
          APK_FILE=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not found!"
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "Found APK: $APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TYRO-KANJI-DEBUG-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
