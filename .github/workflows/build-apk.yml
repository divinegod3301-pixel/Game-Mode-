name: MaiKanji APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract MaiKanji source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="MAIKANJI_JAPANESE_UI_EXACT_WIDGET_INSTANT.zip"

          echo "Checking for ZIP..."
          ls -lh "$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in repository root."
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "======================================"
          echo "ZIP EXTRACTED"
          echo "======================================"

          find extracted -maxdepth 3 -type f | sort

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle project was not found."
            echo "Searching extracted ZIP:"
            find extracted -maxdepth 7 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "======================================"
          echo "GRADLE PROJECT"
          echo "======================================"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app module not found."
            echo "Directories:"
            find "$PROJECT_DIR" -maxdepth 3 -type d | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Make Gradle wrapper executable
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build MaiKanji Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING MAIKANJI"
          echo "======================================"

          echo "Project directory:"
          pwd

          echo ""
          echo "Gradle files:"
          find . -maxdepth 2 -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradlew" \) \
            | sort

          echo ""
          echo "Starting build..."

          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_DIR="${PROJECT_DIR}/app/build/outputs/apk/debug"

          echo "======================================"
          echo "CHECKING APK"
          echo "======================================"

          if ! find "$APK_DIR" -type f -name "*.apk" -print -quit | grep -q .; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          find "$APK_DIR" -type f -name "*.apk" -print

      - name: Upload MaiKanji APK
        uses: actions/upload-artifact@v4
        with:
          name: MaiKanji-${{ github.run_number }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
